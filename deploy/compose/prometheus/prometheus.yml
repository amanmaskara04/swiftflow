global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: apis
    static_configs:
      - targets: ["gateway:8080", "order-api:8001", "inventory-api:8002", "notification-api:8003", "partner-sim:8004"]
  - job_name: workers
    static_configs:
      - targets: ["order-worker:9101", "inventory-worker:9102", "notification-worker:9103"]
