# SwiftFlow - full local stack.
#   docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env up -d --build
# Every port is published on 127.0.0.1 only, so nothing is reachable from the network.
# Start-up order (health-checked): postgres, redis, kafka -> *-api (migrations)
#   -> partner-sim -> *-worker -> gateway -> web.
name: swiftflow

x-python-service: &python-service
  restart: unless-stopped
  init: true
  stop_grace_period: 10s
  read_only: true            # the image is immutable at run time
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP: kafka:29092
  JWT_ISSUER: ${JWT_ISSUER:-swiftflow-order}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-swiftflow}
  JWKS_URL: http://order-api:8001/.well-known/jwks.json
  RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-200}
  RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-1000}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-order-env: &order-env
  <<: *common-env
  DATABASE_URL: postgresql://order_svc:${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in deploy/compose/.env}@postgres:5432/swiftflow
  PAYMENT_URL: http://partner-sim:8004
  PROVIDER_API_KEY: ${PROVIDER_API_KEY:?set PROVIDER_API_KEY in deploy/compose/.env}
  JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
  TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-900}

x-inventory-env: &inventory-env
  <<: *common-env
  DATABASE_URL: postgresql://inventory_svc:${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in deploy/compose/.env}@postgres:5432/swiftflow

x-notification-env: &notification-env
  <<: *common-env
  DATABASE_URL: postgresql://notification_svc:${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in deploy/compose/.env}@postgres:5432/swiftflow
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-partner-sim:8004}
  WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-true}

x-api-healthcheck: &api-healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: swiftflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}
      POSTGRES_DB: swiftflow
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    command: ["postgres", "-c", "max_connections=200"]
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftflow -d swiftflow"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 15s

  # ------------------------------------------------------------------ order
  order-api:
    <<: *python-service
    build: { context: ../.., dockerfile: services/order/Dockerfile }
    image: swiftflow/order:local
    environment:
      <<: *order-env
      SERVICE_NAME: order-api
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz', timeout=2)"]

  order-worker:
    <<: *python-service
    build: { context: ../.., dockerfile: services/order/Dockerfile }
    image: swiftflow/order:local
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *order-env
      SERVICE_NAME: order-worker
      WORKER_PORT: 9101
    ports: ["127.0.0.1:9101:9101"]
    depends_on:
      order-api: { condition: service_healthy }
      kafka: { condition: service_healthy }
      partner-sim: { condition: service_healthy }
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/healthz', timeout=2)"]

  # ------------------------------------------------------------------ inventory
  inventory-api:
    <<: *python-service
    build: { context: ../.., dockerfile: services/inventory/Dockerfile }
    image: swiftflow/inventory:local
    environment:
      <<: *inventory-env
      SERVICE_NAME: inventory-api
    ports: ["127.0.0.1:8002:8002"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/readyz', timeout=2)"]

  inventory-worker:
    <<: *python-service
    build: { context: ../.., dockerfile: services/inventory/Dockerfile }
    image: swiftflow/inventory:local
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *inventory-env
      SERVICE_NAME: inventory-worker
      WORKER_PORT: 9102
    ports: ["127.0.0.1:9102:9102"]
    depends_on:
      inventory-api: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/healthz', timeout=2)"]

  # ------------------------------------------------------------------ notification
  notification-api:
    <<: *python-service
    build: { context: ../.., dockerfile: services/notification/Dockerfile }
    image: swiftflow/notification:local
    environment:
      <<: *notification-env
      SERVICE_NAME: notification-api
    ports: ["127.0.0.1:8003:8003"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/readyz', timeout=2)"]

  notification-worker:
    <<: *python-service
    build: { context: ../.., dockerfile: services/notification/Dockerfile }
    image: swiftflow/notification:local
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *notification-env
      SERVICE_NAME: notification-worker
      WORKER_PORT: 9103
    ports: ["127.0.0.1:9103:9103"]
    depends_on:
      notification-api: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9103/healthz', timeout=2)"]

  # ------------------------------------------------------------------ edge
  partner-sim:
    <<: *python-service
    build: { context: ../.., dockerfile: services/partner-sim/Dockerfile }
    image: swiftflow/partner-sim:local
    environment:
      <<: *common-env
      SERVICE_NAME: partner-sim
      PROVIDER_API_KEY: ${PROVIDER_API_KEY}
      DEFAULT_FAILURE_RATE: ${DEFAULT_FAILURE_RATE:-0}
      DEFAULT_LATENCY_MS: ${DEFAULT_LATENCY_MS:-50}
    ports: ["127.0.0.1:8004:8004"]
    depends_on:
      order-api: { condition: service_healthy }
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz', timeout=2)"]

  gateway:
    <<: *python-service
    build: { context: ../.., dockerfile: services/gateway/Dockerfile }
    image: swiftflow/gateway:local
    environment:
      <<: *common-env
      SERVICE_NAME: gateway
      ORDER_URL: http://order-api:8001
      INVENTORY_URL: http://inventory-api:8002
      NOTIFICATION_URL: http://notification-api:8003
      PARTNER_SIM_URL: http://partner-sim:8004
      ORDER_WORKER_URL: http://order-worker:9101
      INVENTORY_WORKER_URL: http://inventory-worker:9102
      NOTIFICATION_WORKER_URL: http://notification-worker:9103
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DEMO_CLIENTS: ${DEMO_CLIENTS:-}
      WEBHOOK_TEST_RECEIVER_URL: http://partner-sim:8004/v1/hooks
      UPSTREAM_TIMEOUT_SECONDS: 10
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      order-api: { condition: service_healthy }
      inventory-api: { condition: service_healthy }
      notification-api: { condition: service_healthy }
      partner-sim: { condition: service_healthy }
      order-worker: { condition: service_started }
      inventory-worker: { condition: service_started }
      notification-worker: { condition: service_started }
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz', timeout=2)"]

  web:
    build: { context: ../../web, dockerfile: Dockerfile }
    image: swiftflow/web:local
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      gateway: { condition: service_healthy }

  # ------------------------------------------------------------------ observability (profile)
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]

volumes:
  pgdata:
  kafkadata:
