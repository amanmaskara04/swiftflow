# SwiftFlow CI: lint and unit tests, console build, then the full stack in Docker with
# the integration, security and end-to-end suites and the oversell load test.
# Actions are pinned to commit SHAs; the comment beside each is the release it came from.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install
        run: |
          pip install -r requirements-dev.lock.txt
          pip install --no-deps -e libs/common
      - name: Ruff
        run: ruff check libs services scripts tests loadtest chaos
      - name: Library and contract tests
        run: pytest libs -q
      - name: Service tests
        # Every service names its package "app", so each runs in its own process.
        run: |
          for s in order inventory notification gateway partner-sim; do
            echo "::group::$s"
            (cd "services/$s" && pytest tests -q -p no:cacheprovider)
            echo "::endgroup::"
          done

  web:
    name: Console type-check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  stack:
    name: Full stack, security scan and end-to-end
    needs: [python, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.lock.txt
          pip install --no-deps -e libs/common

      - name: Development settings
        run: cp deploy/compose/.env.example deploy/compose/.env
      - name: Build images
        run: $COMPOSE build

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan a service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: swiftflow/order:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start the stack
        run: $COMPOSE up -d --wait --wait-timeout 300
      - name: Seed demo data
        run: python scripts/seed.py
      - name: Integration and security tests
        run: pytest tests/integration tests/security -q -p no:cacheprovider
      - name: End-to-end smoke
        run: python tests/e2e/smoke.py
      - name: Oversell load test
        run: python loadtest/oversell.py --no-report
      - name: Invariants
        run: python chaos/check_invariants.py

      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
